$engine: 3
$onesync: on
name: ESX Legacy Slim
author: ESX Framework
description: ESX Legacy ufficiale, alleggerita (rimossi addon non essenziali).

tasks:
  # Download default CFX resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]
  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat
  
  # Download and prepare server.cfg / loadingscreen / database
  - action: download_github
    src: https://github.com/esx-framework/esx-recipes
    ref: legacy
    dest: ./tmp/recipe

  - action: move_path
    src: ./tmp/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/recipe/esxLogo.png
    dest: ./esxLogo.png

  # Download basic resources and ESX dependencies

  - action: connect_database

  - action: download_github
    src: https://github.com/esx-framework/esx-core
    ref: main
    dest: ./tmp/core

  - action: query_database
    file: ./tmp/core/[SQL]/legacy.sql
    
  - action: download_github
    src: https://github.com/esx-framework/ESX-Legacy-Addons/
    ref: main
    dest: ./tmp/addons
    timeoutSeconds: 900

  - action: move_path
    src: ./tmp/core/[core]
    dest: ./resources/[core]

  - action: move_path
    src: ./tmp/addons/[esx_addons]
    dest: ./resources/[esx_addons]

  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/pma-voice

  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/oxmysql.zip

  - action: download_file
    path: ./tmp/files/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip

  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/files/ox_lib.zip

  ## Rimozione addon non essenziali (riaggiungi quelli che ti servono togliendo le righe)
  - action: remove_path
    path: ./resources/[esx_addons]/esx_adminmenu
  - action: remove_path
    path: ./resources/[esx_addons]/esx_animations
  - action: remove_path
    path: ./resources/[esx_addons]/esx_boat
  - action: remove_path
    path: ./resources/[esx_addons]/esx_cruisecontrol
  - action: remove_path
    path: ./resources/[esx_addons]/esx_drugs
  - action: remove_path
    path: ./resources/[esx_addons]/esx_jobs
  - action: remove_path
    path: ./resources/[esx_addons]/esx_joblisting
  - action: remove_path
    path: ./resources/[esx_addons]/esx_optionalneeds
  - action: remove_path
    path: ./resources/[esx_addons]/esx_pausemenu
  - action: remove_path
    path: ./resources/[esx_addons]/esx_scoreboard
  - action: remove_path
    path: ./resources/[esx_addons]/esx_taxijob
  - action: remove_path
    path: ./resources/[esx_addons]/esx_weather
  - action: remove_path
    path: ./resources/[esx_addons]/esx_weaponshop

  ## Cleanup
  - action: remove_path
    path: ./tmp
