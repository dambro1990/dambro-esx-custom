$engine: 3
$onesync: on

name: Dambro ESX Custom
version: 1.0.0
author: Dambro Development
description: ESX Legacy custom base with ox_inventory, ox_lib, oxmysql and automatic database setup.

tasks:
  # CFX default resources
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Official ESX core and addons
  - action: download_github
    src: https://github.com/esx-framework/esx_core
    ref: main
    dest: ./tmp/esx_core

  - action: download_github
    src: https://github.com/esx-framework/ESX-Legacy-Addons
    ref: main
    dest: ./tmp/esx_addons
    timeoutSeconds: 900

  # Required standalone dependencies
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip

  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[standalone]

  # ox_inventory release package (prebuilt NUI)
  - action: download_file
    url: https://github.com/CommunityOx/ox_inventory/releases/latest/download/ox_inventory.zip
    path: ./tmp/ox_inventory.zip

  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[standalone]

  # Optional standard RP resources
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/pma-voice

  # Put ESX resources in their final folders
  - action: move_path
    src: ./tmp/esx_core/[core]
    dest: ./resources/[core]

  - action: move_path
    src: ./tmp/esx_addons/[esx_addons]
    dest: ./resources/[esx_addons]

  # ox_inventory replaces the default ESX inventory.
  # Do not start both inventory systems.
  - action: remove_path
    path: ./resources/[core]/esx_inventory

  # Create and initialize the database
  - action: connect_database

  - action: query_database
    file: ./tmp/esx_core/[SQL]/legacy.sql

  # Generate a clean server configuration with the correct startup order
  - action: write_file
    file: ./server.cfg
    data: |
      # Dambro ESX Custom - generated by txAdmin
      {{serverEndpoints}}

      sv_hostname "{{serverName}}"
      sets tags "roleplay, esx, dambro"
      sets locale "it-IT"

      sv_maxclients {{maxClients}}
      sv_licenseKey "{{svLicense}}"

      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_slow_query_warning 150

      setr esx:locale "it"
      setr inventory:framework "esx"
      setr inventory:accounts '["money", "black_money"]'

      set onesync on

      # CFX defaults
      ensure mapmanager
      ensure spawnmanager
      ensure sessionmanager
      ensure hardcap
      ensure rconlog
      ensure [cfx-default]

      # Database and libraries
      ensure oxmysql
      ensure ox_lib

      # ESX shared library and core must start before ox_inventory.
      ensure esx_lib
      ensure es_extended
      ensure ox_inventory

      # Remaining ESX resources and addons
      ensure [core]
      ensure [esx_addons]

      # Standalone resources
      ensure bob74_ipl
      ensure pma-voice

      # Server settings
      sv_scriptHookAllowed 0
      set onesync_population true
      setr voice_useNativeAudio true
      setr voice_useSendingRangeOnly true

  # Remove temporary downloads
  - action: remove_path
    path: ./tmp
